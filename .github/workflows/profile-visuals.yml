name: Profile visuals

# Regenerates the contribution snake and the 3D contribution city.
on:
  schedule:
    - cron: "0 7 * * *" # 3 AM in The Bahamas (EDT)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/profile-visuals.yml]

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Bahamas colors: gold snake, aquamarine contribution squares
          outputs: |
            dist/snake-light.svg?color_snake=#FFC72C&color_dots=#ebedf0,#b3ecf5,#5fd2e6,#00abc9,#00788d
            dist/snake-dark.svg?color_snake=#FFC72C&color_dots=#161b22,#00505e,#00788d,#00abc9,#5fd2e6

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output-snake
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  city:
    runs-on: ubuntu-latest
    steps:
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output-3d
          build_dir: profile-3d-contrib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
