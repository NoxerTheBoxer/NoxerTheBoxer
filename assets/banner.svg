<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Brandon Dathan Rolle, Freeport, Grand Bahama">
  <style>
    .wave { animation: drift 9s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-120px); } }
    .name { font: 700 52px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #000; animation: rise 1.2s ease-out both; }
    .sub { font: 600 20px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #000; letter-spacing: 3px; animation: rise 1.2s 0.3s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .wave, .name, .sub { animation: none; } }
  </style>
  <defs>
    <clipPath id="card"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="260" fill="#00ABC9"/>
    <!-- gold middle stripe, centered on the chevron tip (y=130) like the flag -->
    <g class="wave">
      <path fill="#FFC72C" d="M0 113 C 200 107, 400 119, 600 113 S 1000 107, 1200 113 S 1400 119, 1440 113 V 260 H 0 Z"/>
      <path fill="#00ABC9" d="M0 147 C 200 141, 400 153, 600 147 S 1000 141, 1200 147 S 1400 153, 1440 147 V 260 H 0 Z"/>
    </g>
    <!-- black chevron from the hoist side -->
    <path fill="#000" d="M0 0 L170 130 L0 260 Z"/>
    <text class="name" x="660" y="64" text-anchor="middle">Brandon Dathan Rolle</text>
    <text class="sub" x="660" y="96" text-anchor="middle">FREEPORT, GRAND BAHAMA</text>
  </g>
</svg>
